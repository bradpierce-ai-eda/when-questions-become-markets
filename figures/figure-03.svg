<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632" role="img" aria-labelledby="title desc"><title id="title">Two discovery routes meet at paid feasibility</title><desc id="desc">Buyer-first and capability-first discovery meet at a proposed paid feasibility investigation, which may revise questions, methods and scope. The defensible result can be stopping, a narrower agreed inquiry or a qualified purchased order. Interest, orders and usable funds remain distinct.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="30" y="20" width="440" height="100" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="50" y="54" font-size="25" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Buyer decision</tspan></text><text x="50" y="89" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">A consequential uncertainty</tspan></text><rect x="530" y="20" width="440" height="100" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="550" y="54" font-size="25" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="550" dy="0">Owner capability</tspan></text><text x="550" y="89" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="550" dy="0">An archive or measurement route</tspan></text><path d="M 250 120 L 250 165" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 750 120 L 750 165" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="250" y="196" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="250" dy="0">Define the question and</tspan><tspan x="250" dy="29">confirm willingness to pay</tspan></text><text x="750" y="196" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="750" dy="0">Propose a use; a buyer confirms</tspan><tspan x="750" dy="29">the question and willingness to pay</tspan></text><path d="M 250 237 L 250 260 L 500 260 L 500 280" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 750 237 L 750 260 L 500 260" fill="none" stroke="#53656f" stroke-width="2" /><rect x="230" y="280" width="540" height="106" rx="4" fill="#f4f5f5" stroke="#1e6772" stroke-width="1.7" /><text x="500" y="316" font-size="25" fill="#203d50" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Paid feasibility investigation</tspan></text><text x="500" y="350" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Qualify an orderable protocol—or justify stopping</tspan></text><path d="M 500 386 L 500 417 L 250 417 L 250 449" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 500 417 L 750 417 L 750 449" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="450" width="440" height="120" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="50" y="484" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Completed investigation: stop</tspan></text><text x="50" y="519" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Physical, rights, timing, cost or</tspan><tspan x="50" dy="29">committed-demand limits in scope</tspan></text><rect x="530" y="450" width="440" height="120" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="550" y="484" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="550" dy="0">Qualified follow-on order</tspan></text><text x="550" y="519" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="550" dy="0">Only if feasible, permitted and</tspan><tspan x="550" dy="29">purchased on agreed terms</tspan></text><text x="500" y="606" font-size="22" fill="#53656f" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">The investigation fee buys defensible work, whether or not an observation is ordered.</tspan></text></g></svg>