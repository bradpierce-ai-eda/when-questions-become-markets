<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="title desc"><title id="title">Three separate economic questions</title><desc id="desc">Three equally weighted panels ask whether an inquiry is worth its full cost, whether parties can agree authorized uses and terms, and whether spendable funds meet dated outlays. Corresponding failure examples are qualification consuming value, parties unable to agree and contingent receipts arriving too late. There are no progression arrows, numerical scores or assumed financing winner.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" font-size="26" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="30" dy="0">Three separate economic questions</tspan></text><rect x="30" y="95" width="300" height="350" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="50" y="137" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Worth doing?</tspan></text><text x="50" y="194" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Decision value against</tspan><tspan x="50" dy="29">full resource cost</tspan></text><path d="M 50 253 L 310 253" fill="none" stroke="#9aa9b0" stroke-width="1.4" /><text x="50" y="294" font-size="20" fill="#53656f" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Possible failure</tspan></text><text x="50" y="339" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Qualification consumes</tspan><tspan x="50" dy="29">the expected benefit.</tspan></text><rect x="350" y="95" width="300" height="350" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="370" y="137" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="370" dy="0">Acceptable terms?</tspan></text><text x="370" y="194" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="370" dy="0">Compatible uses, prices</tspan><tspan x="370" dy="29">and allocation of risk</tspan></text><path d="M 370 253 L 630 253" fill="none" stroke="#9aa9b0" stroke-width="1.4" /><text x="370" y="294" font-size="20" fill="#53656f" text-anchor="start" font-weight="400"><tspan x="370" dy="0">Possible failure</tspan></text><text x="370" y="339" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="370" dy="0">Parties cannot agree</tspan><tspan x="370" dy="29">on authorized terms.</tspan></text><rect x="670" y="95" width="300" height="350" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="690" y="137" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="690" dy="0">Cash when needed?</tspan></text><text x="690" y="194" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="690" dy="0">Spendable funds meet</tspan><tspan x="690" dy="29">dated outlays</tspan></text><path d="M 690 253 L 950 253" fill="none" stroke="#9aa9b0" stroke-width="1.4" /><text x="690" y="294" font-size="20" fill="#53656f" text-anchor="start" font-weight="400"><tspan x="690" dy="0">Possible failure</tspan></text><text x="690" y="339" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="690" dy="0">Delivery-contingent</tspan><tspan x="690" dy="29">receipts arrive too late.</tspan></text><text x="30" y="499" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="30" dy="0">Positive value does not guarantee agreement or completion cash.</tspan></text><text x="30" y="532" font-size="22" fill="#53656f" text-anchor="start" font-weight="400"><tspan x="30" dy="0">Investment return, repayment and recovery need their own assessment.</tspan></text></g></svg>