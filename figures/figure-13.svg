<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 675" width="1000" height="675" role="img" aria-labelledby="title desc"><title id="title">Cooperative ownership, outputs and retained capacity</title><desc id="desc">Member sites authorize sampling by a cooperative that governs instruments, capability and permitted outputs. Independent evaluation returns qualified results before distinct public aggregate and commercial field outputs are released. Members receive useful feedback and agreed income, brokers earn service fees, switching has costs and any grant is separate. Participating sites need not represent a region; collective authority does not replace other required permissions or fund every worthwhile question.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="25" y="32" font-size="25" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="25" dy="0">Hypothetical cooperative arrangement</tspan></text><rect x="25" y="85" width="215" height="100" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="132.5" y="127.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="132.5" dy="0">Member sites</tspan><tspan x="132.5" dy="29">Authorize sampling</tspan></text><rect x="285" y="60" width="375" height="315" rx="4" fill="#eef5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="472" y="90" font-size="23" fill="#203d50" text-anchor="middle" font-weight="600"><tspan x="472" dy="0">Cooperative ownership</tspan></text><rect x="310" y="112" width="325" height="75" rx="4" fill="#ffffff" stroke="#9aa9b0" stroke-width="1.7" /><text x="472.5" y="142.48" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="472.5" dy="0">Reusable instruments</tspan><tspan x="472.5" dy="29">and local capability</tspan></text><rect x="310" y="250" width="325" height="83" rx="4" fill="#ffffff" stroke="#9aa9b0" stroke-width="1.7" /><text x="472.5" y="284.48" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="472.5" dy="0">Permitted output rules</tspan><tspan x="472.5" dy="29">and member allocations</tspan></text><path d="M 240 130 L 285 130" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="40" y="220" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Useful feedback</tspan><tspan x="40" dy="29">and agreed income</tspan></text><path d="M 310 290 L 265 290 L 265 270 L 15 270 L 15 160 L 25 160" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="472" y="215" font-size="21" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="472" dy="0">Owns and governs</tspan></text><rect x="735" y="80" width="240" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="855.0" y="112.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="855.0" dy="0">Public research</tspan><tspan x="855.0" dy="29">purchaser</tspan></text><rect x="735" y="260" width="240" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="855.0" y="292.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="855.0" dy="0">Commercial</tspan><tspan x="855.0" dy="29">purchaser</tspan></text><path d="M 635 267 L 700 267" fill="none" stroke="#53656f" stroke-width="2" /><path d="M 700 267 L 700 180 L 855 180 L 855 160" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="720" y="212" font-size="21" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="720" dy="0">Public aggregate</tspan><tspan x="720" dy="27">findings</tspan></text><path d="M 635 310 L 705 310 L 705 380 L 855 380 L 855 340" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="720" y="420" font-size="21" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="720" dy="0">Field-level results</tspan><tspan x="720" dy="27">as authorized</tspan></text><path d="M 735 100 L 690 100 L 690 48 L 472 48 L 472 60" fill="none" stroke="#1e6772" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#cash)" /><text x="715" y="30" font-size="21" fill="#1e6772" text-anchor="start" font-weight="400"><tspan x="715" dy="0">Scoped payments</tspan></text><path d="M 975 300 L 990 300 L 990 48 L 690 48" fill="none" stroke="#1e6772" stroke-width="2" stroke-dasharray="7 5" /><rect x="300" y="420" width="325" height="73" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="462.5" y="450.14" font-size="21" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="462.5" dy="0">Independent evaluation</tspan><tspan x="462.5" dy="27">Valid adverse results count</tspan></text><path d="M 460 420 L 460 333" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="300" y="520" font-size="21" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="300" dy="0">Qualified results under agreed rules</tspan></text><rect x="25" y="550" width="215" height="65" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="132.5" y="589.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="132.5" dy="0">Broker service</tspan></text><rect x="735" y="550" width="240" height="65" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="855.0" y="589.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="855.0" dy="0">Alternative broker</tspan></text><path d="M 240 582 L 265 582 L 265 350 L 285 350" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="290" y="585" font-size="21" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="290" dy="0">Fee for service; switching has costs</tspan></text><path d="M 735 582 L 690 582 L 690 350 L 660 350" fill="none" stroke="#53656f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="25" y="650" font-size="21" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="25" dy="0">Grant contribution, if any, is separately identified; it is not assumed commercial income.</tspan></text></g></svg>