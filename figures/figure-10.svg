<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" width="1000" height="735" role="img" aria-labelledby="title desc"><title id="title">What can be measured, and where</title><desc id="desc">The pump interior is inaccessible and its relation to exterior temperature, vibration and pressure readings is uncertain. Bench calibration supports a bounded independent review of signal and access conditions and a wear-link plan for the pilot. A wear claim needs an independently assessed outcome or surrogate validated against wear in the stated regime. Only a bounded next stage is authorized; failure can justify stopping or narrower monitoring.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="30" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="30" dy="0">Illustrative measurement-access problem</tspan></text><rect x="30" y="80" width="450" height="285" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="55" y="118" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="55" dy="0">Assembly: access is limited</tspan></text><rect x="70" y="155" width="370" height="140" rx="4" fill="white" stroke="#9aa9b0" stroke-width="1.7" stroke-dasharray="7 5" /><text x="255" y="195" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="255" dy="0">Inaccessible interior</tspan><tspan x="255" dy="29">Suspected mechanism:</tspan><tspan x="255" dy="29">wear during short transients</tspan></text><text x="55" y="337" font-size="20" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="55" dy="0">Direct interior route unavailable</tspan></text><rect x="580" y="80" width="390" height="285" rx="4" fill="#eef5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="605" y="118" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="605" dy="0">Candidate exterior readings</tspan></text><text x="605" y="168" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="605" dy="0">Temperature</tspan><tspan x="605" dy="42">Vibration</tspan><tspan x="605" dy="42">Pressure</tspan></text><text x="605" y="326" font-size="20" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="605" dy="0">Synchronization is required</tspan></text><path d="M 440 225 L 580 225" fill="none" stroke="#53656f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><text x="530" y="181" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="530" dy="0">Uncertain</tspan><tspan x="530" dy="26">relation</tspan></text><rect x="30" y="425" width="450" height="150" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="55" y="460" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="55" dy="0">Controlled bench calibration</tspan></text><text x="55" y="501" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="55" dy="0">Compare candidate measurements</tspan><tspan x="55" dy="29">under stated conditions</tspan></text><rect x="580" y="425" width="390" height="150" rx="4" fill="#eef5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="605" y="460" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="605" dy="0">Bounded independent check</tspan></text><text x="605" y="501" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="605" dy="0">Access + signal conditions</tspan><tspan x="605" dy="29">Wear-link plan for the pilot</tspan></text><path d="M 480 500 L 580 500" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="530" y="480" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="530" dy="0">tests</tspan></text><path d="M 775 365 L 775 425" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="30" y="625" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="30" dy="0">A wear claim requires an independently assessed outcome</tspan><tspan x="30" dy="29">or a surrogate validated against wear in the stated regime.</tspan></text><text x="30" y="704" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="30" dy="0">Authorize only the next bounded stage; stop or narrow the claim if it fails.</tspan></text></g></svg>