<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 725" width="1000" height="725" role="img" aria-labelledby="title desc"><title id="title">Six institutional arrangements</title><desc id="desc">Six equally weighted alternative institutional diagrams show integrated specialists, embedded procurement, neutral exchange, supplier cooperatives, broker federation and public purchasing. They allocate roles differently without a ranking. Member, public and commercial purposes can diverge; permissions, qualified alternatives and usable observation slots constrain switching.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="15" width="470" height="220" rx="4" fill="#ffffff" stroke="#9aa9b0" stroke-width="1.7" /><text x="35" y="46" font-size="23" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="35" dy="0">Integrated specialist</tspan></text><rect x="35" y="100" width="110" height="55" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="90.0" y="134.3" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="90.0" dy="0">Buyer</tspan></text><rect x="195" y="70" width="275" height="145" rx="4" fill="#eef5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="332" y="97" font-size="21" fill="#203d50" text-anchor="middle" font-weight="600"><tspan x="332" dy="0">Specialist</tspan></text><rect x="210" y="120" width="115" height="60" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="267.5" y="156.8" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="267.5" dy="0">Supplier</tspan></text><rect x="340" y="120" width="115" height="60" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="397.5" y="156.8" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="397.5" dy="0">Evaluator</tspan></text><path d="M 145 127 L 195 127" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="332" y="203" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="332" dy="0">Delivery + judgment</tspan></text><rect x="510" y="15" width="470" height="220" rx="4" fill="#ffffff" stroke="#9aa9b0" stroke-width="1.7" /><text x="525" y="46" font-size="23" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="525" dy="0">Embedded procurement</tspan></text><rect x="525" y="70" width="285" height="63" rx="4" fill="#eef5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="667" y="96" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="667" dy="0">Buyer + authorized</tspan><tspan x="667" dy="26">procurement interface</tspan></text><rect x="840" y="70" width="125" height="63" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="902.5" y="108.3" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="902.5" dy="0">Supplier</tspan></text><path d="M 810 101 L 840 101" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><rect x="840" y="158" width="125" height="55" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="902.5" y="192.3" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="902.5" dy="0">Evaluator</tspan></text><path d="M 840 185 L 550 185 L 550 133" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="680" y="166" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="680" dy="0">Qualified receipt</tspan></text><rect x="20" y="250" width="470" height="220" rx="4" fill="#ffffff" stroke="#9aa9b0" stroke-width="1.7" /><text x="35" y="281" font-size="23" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="35" dy="0">Neutral exchange / network</tspan></text><rect x="35" y="325" width="110" height="55" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="90.0" y="359.3" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="90.0" dy="0">Buyer</tspan></text><rect x="190" y="313" width="130" height="80" rx="4" fill="#eef5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="255.0" y="346.8" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="255.0" dy="0">Common</tspan><tspan x="255.0" dy="26">rules</tspan></text><rect x="365" y="325" width="110" height="55" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="420.0" y="359.3" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="420.0" dy="0">Supplier</tspan></text><path d="M 145 352 L 190 352" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 320 352 L 365 352" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><rect x="175" y="403" width="160" height="55" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="255.0" y="424.3" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="255.0" dy="0">Independent</tspan><tspan x="255.0" dy="26">evaluator</tspan></text><path d="M 255 393 L 255 403" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><rect x="510" y="250" width="470" height="220" rx="4" fill="#ffffff" stroke="#9aa9b0" stroke-width="1.7" /><text x="525" y="281" font-size="23" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="525" dy="0">Supplier-owned cooperative</tspan></text><rect x="525" y="335" width="110" height="55" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="580.0" y="369.3" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="580.0" dy="0">Buyer<