<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 635" width="1000" height="635" role="img" aria-labelledby="title desc"><title id="title">The work history behind the artifact</title><desc id="desc">Two repositories contain the same final artifact, revision C. One retains only that snapshot. The other links requirements to revision A and its failing test, diagnosis, an attempted repair B whose own test fails, further repair to accepted revision C, verification of C and a later contradictory observation. Failed and conflicting evidence remains part of the trace.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f"/></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="25" y="35" font-size="25" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="25" dy="0">Same final artifact; different retained context</tspan></text><rect x="25" y="65" width="225" height="545" rx="4" fill="#ffffff" stroke="#9aa9b0" stroke-width="1.7"/><text x="137" y="100" font-size="23" fill="#203d50" text-anchor="middle" font-weight="600"><tspan x="137" dy="0">Snapshot only</tspan></text><rect x="45" y="250" width="185" height="90" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="137.5" y="287.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="137.5" dy="0">Final artifact</tspan><tspan x="137.5" dy="29">Revision C</tspan></text><text x="137" y="420" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="137" dy="0">Earlier evidence</tspan><tspan x="137" dy="29">not linked</tspan></text><rect x="280" y="65" width="695" height="545" rx="4" fill="#ffffff" stroke="#9aa9b0" stroke-width="1.7"/><text x="300" y="100" font-size="23" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="300" dy="0">Linked work episode</tspan></text><rect x="300" y="135" width="195" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="397.5" y="167.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="397.5" dy="0">Requirement</tspan><tspan x="397.5" dy="29">and inputs</tspan></text><rect x="530" y="135" width="195" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="627.5" y="182.48" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="627.5" dy="0">Revision A</tspan></text><rect x="760" y="135" width="195" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="857.5" y="167.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="857.5" dy="0">Test of A</tspan><tspan x="857.5" dy="29">fails</tspan></text><rect x="300" y="290" width="195" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="397.5" y="322.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="397.5" dy="0">Test of B</tspan><tspan x="397.5" dy="29">fails</tspan></text><rect x="530" y="290" width="195" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="627.5" y="322.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="627.5" dy="0">Attempted</tspan><tspan x="627.5" dy="29">repair B</tspan></text><rect x="760" y="290" width="195" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="857.5" y="322.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="857.5" dy="0">Diagnosis</tspan><tspan x="857.5" dy="29">of A failure</tspan></text><rect x="300" y="445" width="195" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="397.5" y="478.8" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="397.5" dy="0">Further repair</tspan><tspan x="397.5" dy="26">C accepted</tspan></text><rect x="530" y="445" width="195" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="627.5" y="477.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="627.5" dy="0">Verification</tspan><tspan x="627.5" dy="29">tests C</tspan></text><rect x="760" y="445" width="195" height="80" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7"/><text x="857.5" y="477.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="857.5" dy="0">Later observation</tspan><tspan x="857.5" dy="29">contradicts claim</tspan></text><path d="M 495 175.0 L 530 175.0" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)"/><path d="M 725 175.0 L 760 175.0" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)"/><path d="M 760 330.0 L 725 330.0" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)"/><path d="M 530 330.0 L 495 330.0" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)"/><path d="M 495 485.0 L 530 485.0" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)"/><path d="M 725 485.0 L 760 485.0" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)"/><path d="M 857.5 215 L 857.5 290" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)"/><path d="M 397.5 370 L 397.5 445" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)"/><text x="315" y="252" font-size="21" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="315" dy="0">Retain the failed repair</tspan></text><text x="315" y="568" font-size="21" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="315" dy="0">Links identify which revision each observation tested.</tspan></text></g></svg>