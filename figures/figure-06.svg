<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="title desc"><title id="title">Evidence outcomes and contract consequences</title><desc id="desc">Four separate acceptance records distinguish procedure, validity, decision sufficiency and payment. Supportive or adverse valid evidence can inform action, including continuation. Inconclusive evidence leaves the specified inference unresolved; the decision owner assesses action separately. Agreed work can earn a milestone; failed methods need not earn delivery payment. Misconduct is separate from unwelcome evidence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="25" y="35" font-size="25" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="25" dy="0">Four separate acceptance records</tspan></text><rect x="25" y="56" width="230" height="76" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="140.0" y="86.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="140.0" dy="0">Procedural</tspan><tspan x="140.0" dy="29">completion</tspan></text><rect x="270" y="56" width="230" height="76" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="385.0" y="86.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="385.0" dy="0">Evidence</tspan><tspan x="385.0" dy="29">validity</tspan></text><rect x="515" y="56" width="230" height="76" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="630.0" y="86.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="630.0" dy="0">Decision</tspan><tspan x="630.0" dy="29">sufficiency</tspan></text><rect x="760" y="56" width="230" height="76" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="875.0" y="86.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="875.0" dy="0">Payment</tspan><tspan x="875.0" dy="29">acceptance</tspan></text><text x="25" y="173" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="25" dy="0">Scientific outcome</tspan></text><text x="290" y="173" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="290" dy="0">Evidence and decision</tspan></text><text x="655" y="173" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="655" dy="0">Agreed payment event</tspan></text><rect x="25" y="190" width="235" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="142.5" y="225.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="142.5" dy="0">Support for</tspan><tspan x="142.5" dy="29">the hypothesis</tspan></text><rect x="285" y="190" width="340" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="455.0" y="225.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="455.0" dy="0">Valid evidence may</tspan><tspan x="455.0" dy="29">resolve the decision</tspan></text><rect x="650" y="190" width="325" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="812.5" y="225.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="812.5" dy="0">Accepted only under</tspan><tspan x="812.5" dy="29">the agreed conditions</tspan></text><path d="M 260 233 L 285 233" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 625 233 L 650 233" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><rect x="25" y="292" width="235" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="142.5" y="327.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="142.5" dy="0">Valid adverse</tspan><tspan x="142.5" dy="29">finding</tspan></text><rect x="285" y="292" width="340" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="455.0" y="327.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="455.0" dy="0">May reject or weaken</tspan><tspan x="455.0" dy="29">the proposed mechanism</tspan></text><rect x="650" y="292" width="325" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="812.5" y="327.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="812.5" dy="0">Can be accepted</tspan><tspan x="812.5" dy="29">and paid</tspan></text><path d="M 260 335 L 285 335" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 625 335 L 650 335" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><rect x="25" y="394" width="235" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="142.5" y="429.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="142.5" dy="0">Inconclusive</tspan><tspan x="142.5" dy="29">evidence</tspan></text><rect x="285" y="394" width="340" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="455.0" y="429.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="455.0" dy="0">Inference unresolved;</tspan><tspan x="455.0" dy="29">action assessed separately</tspan></text><rect x="650" y="394" width="325" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="812.5" y="429.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="812.5" dy="0">May earn an agreed</tspan><tspan x="812.5" dy="29">milestone</tspan></text><path d="M 260 437 L 285 437" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 625 437 L 650 437" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><rect x="25" y="496" width="235" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="142.5" y="531.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="142.5" dy="0">Method or</tspan><tspan x="142.5" dy="29">calibration failure</tspan></text><rect x="285" y="496" width="340" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="455.0" y="531.98" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="455.0" dy="0">Promised evidence</tspan><tspan x="455.0" dy="29">has not been supplied</tspan></text><rect x="650" y="496" width="325" height="86" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="812.5" y="517.48" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="812.5" dy="0">Delivery payment may</tspan><tspan x="812.5" dy="29">be withheld; setup may</tspan><tspan x="812.5" dy="29">still be earned</tspan></text><path d="M 260 539 L 285 539" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 625 539 L 650 539" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="25" y="635" font-size="21" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="25" dy="0">Misrepresentation is misconduct; an unwelcome result is not evidence of fraud.</tspan></text></g></svg>