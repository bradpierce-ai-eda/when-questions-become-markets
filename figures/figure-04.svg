<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" width="1000" height="735" role="img" aria-labelledby="title desc"><title id="title">Qualifying an observation route</title><desc id="desc">An illustrative pump question maps temperature, vibration and pressure exposure variables to a candidate calibrated exterior method, an independent evaluator and instrument, permission and timing conditions. A late disassembly route is excluded. A separate wear claim needs an independently assessed outcome or a surrogate validated against wear within the stated regime. Leads, demonstrated capabilities and accepted results are distinct.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="33" font-size="20" fill="#53656f" text-anchor="start" font-weight="700"><tspan x="30" dy="0">ILLUSTRATIVE PUMP QUESTION</tspan></text><text x="30" y="72" font-size="26" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="30" dy="0">Do transient conditions help explain seal wear?</tspan></text><rect x="30" y="112" width="300" height="104" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="50" y="147" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Exposure variables</tspan></text><text x="50" y="181" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Temperature, vibration</tspan><tspan x="50" dy="29">and pressure over time</tspan></text><rect x="500" y="112" width="470" height="104" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="520" y="147" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="520" dy="0">Candidate measurement method</tspan></text><text x="520" y="181" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="520" dy="0">Synchronized exterior readings,</tspan><tspan x="520" dy="29">calibrated against a bench condition</tspan></text><path d="M 180 84 L 180 112" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="210" y="104" font-size="20" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="210" dy="0">needs</tspan></text><path d="M 500 178 L 342 178" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="414" y="127" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="414" dy="0">may measure</tspan><tspan x="414" dy="26">under conditions</tspan></text><path d="M 735 216 L 735 257" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="735" y="287" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="735" dy="0">requires instruments and access</tspan></text><rect x="500" y="310" width="470" height="100" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="520" y="345" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="520" dy="0">Instrument and access conditions</tspan></text><text x="520" y="378" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="520" dy="0">Permission + a usable observation window</tspan></text><rect x="30" y="310" width="300" height="100" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="50" y="345" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Independent evaluator</tspan></text><text x="50" y="378" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Tests the bounded method</tspan></text><path d="M 180 310 L 180 257 L 480 257 L 480 194 L 500 194" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="310" y="245" font-size="20" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="310" dy="0">qualifies the route</tspan></text><rect x="30" y="455" width="940" height="90" rx="4" fill="none" stroke="#9aa9b0" stroke-width="1.7" stroke-dasharray="6 5" /><text x="50" y="490" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Excluded route: direct measurement during disassembly</tspan></text><text x="50" y="524" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Access would occur after the buyer’s decision deadline.</tspan></text><text x="30" y="596" font-size="22" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="30" dy="0">Text-derived lead → demonstrated capability → accepted contract result</tspan></text><text x="30" y="629" font-size="22" fill="#53656f" text-anchor="start" font-weight="400"><tspan x="30" dy="0">Each transition needs its own evidence; the map alone supplies none.</tspan></text><text x="30" y="676" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="30" dy="0">A wear claim requires an independently assessed outcome</tspan><tspan x="30" dy="29">or a surrogate validated against wear in the stated regime.</tspan></text></g></svg>