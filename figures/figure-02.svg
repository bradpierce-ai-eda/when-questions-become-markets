<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="title desc"><title id="title">One archive, several possible customers</title><desc id="desc">An illustrative pump maintenance archive connects to materials-fatigue research, insurance-risk assessment, fault-detection evaluation and digital-twin validation. The links are possible uses, not purchases or access rights.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f"/></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="33" font-size="20" fill="#53656f" text-anchor="start" font-weight="700"><tspan x="40" dy="0">EXISTING RECORDS</tspan></text><text x="550" y="33" font-size="20" fill="#53656f" text-anchor="start" font-weight="700"><tspan x="550" dy="0">POSSIBLE EXTERNAL DECISIONS</tspan></text><rect x="40" y="126" width="330" height="200" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7"/><text x="62" y="164" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="62" dy="0">Pump maintenance</tspan><tspan x="62" dy="31">history</tspan></text><text x="62" y="238" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="62" dy="0">Failures and repairs</tspan><tspan x="62" dy="29">Operating conditions</tspan><tspan x="62" dy="29">Parts and service outcomes</tspan></text><path d="M 370 226 L 484 226" fill="none" stroke="#53656f" stroke-width="2"/><path d="M 484 226 L 484 99 L 536 99" fill="none" stroke="#53656f" stroke-width="2"/><path d="M 550 140 L 960 140" fill="none" stroke="#9aa9b0" stroke-width="2"/><text x="550" y="89" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="550" dy="0">Materials fatigue</tspan></text><text x="550" y="122" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="550" dy="0">How does wear develop in use?</tspan></text><path d="M 370 226 L 484 226" fill="none" stroke="#53656f" stroke-width="2"/><path d="M 484 226 L 484 194 L 536 194" fill="none" stroke="#53656f" stroke-width="2"/><path d="M 550 235 L 960 235" fill="none" stroke="#9aa9b0" stroke-width="2"/><text x="550" y="184" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="550" dy="0">Insurance risk</tspan></text><text x="550" y="217" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="550" dy="0">What predicts mechanical failure?</tspan></text><path d="M 370 226 L 484 226" fill="none" stroke="#53656f" stroke-width="2"/><path d="M 484 226 L 484 289 L 536 289" fill="none" stroke="#53656f" stroke-width="2"/><path d="M 550 330 L 960 330" fill="none" stroke="#9aa9b0" stroke-width="2"/><text x="550" y="279" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="550" dy="0">Fault detection</tspan></text><text x="550" y="312" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="550" dy="0">Does a warning method work?</tspan></text><path d="M 370 226 L 484 226" fill="none" stroke="#53656f" stroke-width="2"/><path d="M 484 226 L 484 384 L 536 384" fill="none" stroke="#53656f" stroke-width="2"/><path d="M 550 425 L 960 425" fill="none" stroke="#9aa9b0" stroke-width="2"/><text x="550" y="374" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="550" dy="0">Digital-twin validation</tspan></text><text x="550" y="407" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="550" dy="0">Where does simulation diverge?</tspan></text><text x="40" y="459" font-size="22" fill="#53656f" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Possible relationships; relevance, permission and demand still require qualification.</tspan></text></g></svg>