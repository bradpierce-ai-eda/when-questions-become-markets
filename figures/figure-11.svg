<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="title desc"><title id="title">Funding one observation program for several buyers</title><desc id="desc">Three $60,000 buyer orders split into $90,000 gated spendable advances and $90,000 contingent future obligations. The operator adds $90,000, funding a $180,000 shared program with separate scoped buyer findings. Feasibility and pilot spending are outside that program. Source ownership and equipment are retained. Completion funding does not establish investment return or renewal.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="28" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="30" dy="0">Illustrative proposed transaction — no lender assumed</tspan></text><rect x="30" y="55" width="280" height="65" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="170" y="80" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="170" dy="0">Buyer 1</tspan><tspan x="170" dy="28">$60,000 order</tspan></text><path d="M 170 120 L 170 145" fill="none" stroke="#53656f" stroke-width="2" /><rect x="360" y="55" width="280" height="65" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="500" y="80" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Buyer 2</tspan><tspan x="500" dy="28">$60,000 order</tspan></text><path d="M 500 120 L 500 145" fill="none" stroke="#53656f" stroke-width="2" /><rect x="690" y="55" width="280" height="65" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="830" y="80" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">Buyer 3</tspan><tspan x="830" dy="28">$60,000 order</tspan></text><path d="M 830 120 L 830 145" fill="none" stroke="#53656f" stroke-width="2" /><path d="M 170 145 L 830 145" fill="none" stroke="#53656f" stroke-width="2" /><path d="M 300 145 L 215 145 L 215 180" fill="none" stroke="#1e6772" stroke-width="2" marker-end="url(#cash)" /><path d="M 700 145 L 785 145 L 785 180" fill="none" stroke="#53656f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><rect x="30" y="180" width="370" height="105" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="55" y="207" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="55" dy="0">$90,000 buyer advances</tspan></text><text x="55" y="238" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="55" dy="0">$30,000 per buyer; spendable</tspan><tspan x="55" dy="29">after setup + permission gates</tspan></text><rect x="600" y="180" width="370" height="105" rx="4" fill="white" stroke="#9aa9b0" stroke-width="1.7" stroke-dasharray="7 5" /><text x="625" y="207" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="625" dy="0">$90,000 future obligations</tspan></text><text x="625" y="238" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="625" dy="0">Delivery + acceptance contingent</tspan><tspan x="625" dy="29">Not spendable program cash</tspan></text><rect x="30" y="325" width="370" height="105" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="55" y="352" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="55" dy="0">$90,000 operator contribution</tspan></text><text x="55" y="383" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="55" dy="0">Bridges initial setup and</tspan><tspan x="55" dy="29">permission work</tspan></text><rect x="500" y="325" width="470" height="105" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="525" y="352" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="525" dy="0">$180,000 available program cash</tspan></text><text x="525" y="383" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="525" dy="0">$90,000 advances + $90,000 operator</tspan><tspan x="525" dy="29">Shared acquisition program</tspan></text><path d="M 400 233 L 450 233 L 450 352 L 500 352" fill="none" stroke="#1e6772" stroke-width="2" marker-end="url(#cash)" /><path d="M 400 383 L 500 383" fill="none" stroke="#1e6772" stroke-width="2" marker-end="url(#cash)" /><path d="M 735 430 L 735 455 L 170 455 L 170 485" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 500 455 L 500 485" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 735 455 L 830 455 L 830 485" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="485" width="280" height="60" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="170" y="509" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="170" dy="0">Buyer 1: scoped finding</tspan><tspan x="170" dy="26">Contracted rights only</tspan></text><rect x="360" y="485" width="280" height="60" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="500" y="509" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Buyer 2: scoped finding</tspan><tspan x="500" dy="26">Contracted rights only</tspan></text><rect x="690" y="485" width="280" height="60" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="830" y="509" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">Buyer 3: scoped finding</tspan><tspan x="830" dy="26">Contracted rights only</tspan></text><text x="30" y="581" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="30" dy="0">Source ownership retained; operator keeps reusable equipment.</tspan></text><text x="30" y="624" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="30" dy="0">Outside this budget: $12,000 feasibility + separately funded pilot.</tspan></text></g></svg>