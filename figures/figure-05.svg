<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="title desc"><title id="title">Observation capability needs continuing support</title><desc id="desc">Instruments and fixtures, qualified people and methods, interpretive context and authorized access support a central usable observation capability. Equal input panels and labeled supporting arrows show complements rather than a ranked sequence. A separate continuing-support band identifies upkeep and requalification; there is no automatic revenue or learning loop. Technical reuse, customer renewal and broker margin are separate results.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" font-size="26" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="30" dy="0">Observation capability needs continuing support</tspan></text><rect x="30" y="90" width="300" height="135" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="50" y="129" font-size="23" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Instruments and fixtures</tspan></text><text x="50" y="172" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Calibration and upkeep</tspan></text><rect x="670" y="90" width="300" height="135" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="690" y="129" font-size="23" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="690" dy="0">People and methods</tspan></text><text x="690" y="172" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="690" dy="0">Qualified operators;</tspan><tspan x="690" dy="29">repeatable work</tspan></text><rect x="30" y="420" width="300" height="135" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="50" y="459" font-size="23" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Interpretive context</tspan></text><text x="50" y="502" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Provenance and</tspan><tspan x="50" dy="29">method limits</tspan></text><rect x="670" y="420" width="300" height="135" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="690" y="459" font-size="23" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="690" dy="0">Authorized access</tspan></text><text x="690" y="502" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="690" dy="0">Permissions, sites</tspan><tspan x="690" dy="29">and usable windows</tspan></text><rect x="350" y="265" width="300" height="140" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="500" y="307" font-size="24" fill="#203d50" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Usable observation</tspan><tspan x="500" dy="29">capability</tspan></text><text x="500" y="378" font-size="21" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Fit for the stated inquiry</tspan></text><path d="M 330 158 L 340 158 L 340 302 L 350 302" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 670 158 L 660 158 L 660 302 L 650 302" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 330 488 L 340 488 L 340 370 L 350 370" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><path d="M 670 488 L 660 488 L 660 370 L 650 370" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="500" y="241" font-size="21" fill="#53656f" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Together support</tspan></text><rect x="30" y="591" width="940" height="87" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="50" y="625" font-size="22" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Readiness needs continuing support and requalification.</tspan></text><text x="50" y="658" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Technical reuse, customer renewal and broker margin are separate results.</tspan></text></g></svg>