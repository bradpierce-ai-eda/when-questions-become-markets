<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="title desc"><title id="title">Protected evaluation and a bounded receipt</title><desc id="desc">Customer RTL, revisions, licensed tools, PDK material, detailed logs and permitted evaluation operations sit inside an authorized environment. A release check permits only a scoped receipt describing configurations, method, conditions, uncertainty, exclusions and an authorized result. Independent verification or repeat runs require separately authorized access. Silicon measurement remains a separate physical contract. The enclosure represents governance rather than a universal security guarantee.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker><marker id="cash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1e6772" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="28" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="30" dy="0">Illustrative protected evaluation</tspan></text><rect x="25" y="60" width="615" height="500" rx="4" fill="white" stroke="#1e6772" stroke-width="1.7" /><text x="45" y="93" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="45" dy="0">Authorized environment</tspan></text><rect x="45" y="115" width="255" height="235" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="65" y="147" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="65" dy="0">Permitted inputs</tspan></text><text x="65" y="192" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="65" dy="0">Customer RTL</tspan><tspan x="65" dy="40">Reference + revision</tspan><tspan x="65" dy="40">Licensed tools</tspan><tspan x="65" dy="40">PDK material</tspan></text><rect x="330" y="115" width="285" height="235" rx="4" fill="#eef5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="350" y="147" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="350" dy="0">Permitted operations</tspan></text><text x="350" y="192" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="350" dy="0">Elaboration</tspan><tspan x="350" dy="40">Simulation</tspan><tspan x="350" dy="40">Formal evaluation</tspan><tspan x="350" dy="40">Routed estimates</tspan></text><path d="M 300 235 L 330 235" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><rect x="45" y="370" width="570" height="60" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="65" y="395" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="65" dy="0">Full artifacts, revisions and detailed logs</tspan><tspan x="65" dy="26">remain inside the permitted environment</tspan></text><rect x="45" y="450" width="570" height="85" rx="4" fill="#eef5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="65" y="478" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="65" dy="0">Independent verification or repeat run</tspan></text><text x="65" y="509" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="65" dy="0">Only within separately authorized access</tspan></text><rect x="715" y="130" width="260" height="335" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="735" y="164" font-size="22" fill="#203d50" text-anchor="start" font-weight="600"><tspan x="735" dy="0">Authorized receipt</tspan></text><text x="735" y="209" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="735" dy="0">Scoped claim</tspan><tspan x="735" dy="39">Configurations</tspan><tspan x="735" dy="39">Method + conditions</tspan><tspan x="735" dy="39">Uncertainty</tspan><tspan x="735" dy="39">and exclusions</tspan><tspan x="735" dy="39">Authorized result</tspan></text><path d="M 615 270 L 715 270" fill="none" stroke="#53656f" stroke-width="2" marker-end="url(#arrow)" /><text x="670" y="104" font-size="20" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="670" dy="0">Release check</tspan></text><rect x="715" y="500" width="260" height="100" rx="4" fill="white" stroke="#9aa9b0" stroke-width="1.7" stroke-dasharray="7 5" /><text x="845" y="529" font-size="22" fill="#203d50" text-anchor="middle" font-weight="400"><tspan x="845" dy="0">Silicon measurement</tspan><tspan x="845" dy="29">Separate physical</tspan><tspan x="845" dy="29">contract</tspan></text><text x="30" y="600" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="30" dy="0">The boundary denotes governed authorization,</tspan><tspan x="30" dy="29">not a universal security guarantee.</tspan></text><path d="M 680 116 L 680 254" fill="none" stroke="#53656f" stroke-width="1.3" stroke-dasharray="3 4" /></g></svg>