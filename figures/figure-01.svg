<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" width="1000" height="735" role="img" aria-labelledby="title desc"><title id="title">Different achievements require different evidence</title><desc id="desc">Five claims have separate conditions. A useful evidence relationship can support an answer, justified continuation or useful stop. Further claims concern new observations actually collected, resources invested, additional usable capacity relative to a baseline and permitted qualified learning maintained for later work. Equal panels for the further claims and no progression arrows indicate that these are not compulsory stages. Exploration may be funded before an order.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#53656f" /></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" font-size="26" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="30" dy="0">Different achievements require different evidence</tspan></text><rect x="30" y="75" width="940" height="130" rx="4" fill="#eef5f5" stroke="#1e6772" stroke-width="1.7" /><text x="50" y="113" font-size="25" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Useful evidence relationship</tspan></text><text x="50" y="152" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">A worthwhile contribution to a consequential choice.</tspan><tspan x="50" dy="29">An answer, justified continuation or useful stop can be enough.</tspan></text><text x="30" y="251" font-size="22" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="30" dy="0">Further claims require their own evidence</tspan></text><rect x="30" y="280" width="455" height="155" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="50" y="320" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">New observations</tspan></text><text x="50" y="368" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Qualified collection actually occurs;</tspan><tspan x="50" dy="29">an order alone does not establish it.</tspan></text><rect x="515" y="280" width="455" height="155" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="535" y="320" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="535" dy="0">Actual investment</tspan></text><text x="535" y="368" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="535" dy="0">Resources actually enter capability;</tspan><tspan x="535" dy="29">assess costs, risk and retained benefits.</tspan></text><rect x="30" y="465" width="455" height="155" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="50" y="505" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Additional usable capacity</tspan></text><text x="50" y="553" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Demonstrate a usable increment</tspan><tspan x="50" dy="29">against the relevant baseline.</tspan></text><rect x="515" y="465" width="455" height="155" rx="4" fill="#f4f5f5" stroke="#9aa9b0" stroke-width="1.7" /><text x="535" y="505" font-size="24" fill="#203d50" text-anchor="start" font-weight="700"><tspan x="535" dy="0">Retained learning</tspan></text><text x="535" y="553" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="535" dy="0">Keep permitted feedback as qualified,</tspan><tspan x="535" dy="29">maintainable know-how.</tspan></text><text x="30" y="671" font-size="22" fill="#203d50" text-anchor="start" font-weight="400"><tspan x="30" dy="0">Exploration can be funded before an order.</tspan></text><text x="30" y="708" font-size="22" fill="#53656f" text-anchor="start" font-weight="400"><tspan x="30" dy="0">These claims are not compulsory stages; no automatic progression is implied.</tspan></text></g></svg>